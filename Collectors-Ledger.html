<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-grad: linear-gradient(160deg,#050b1f 0%, #0a1a38 45%, #02060f 100%);
    --sidebar: linear-gradient(190deg,#071730 0%, #030a18 100%);
    --card:#0f2040; --card-hover:#173058;
    --border:#1f4d99; --text:#f2f7ff; --muted:#8fb0da;
    --pink:#ff0e7f; --orange:#ff5e00; --yellow:#ffe600; --cyan:#00f0ff;
    --green:#00ff9d; --red:#ff2d55; --gray:#8a9ac2; --blue:#0d84ff; --teal:#00c2a8;
    --accent:#0d84ff; --accent-dark:#0a5fc0;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg-grad);background-attachment:fixed;color:var(--text);}
  h1,h2,h3,h4{font-family:'Fredoka','Poppins',sans-serif;}
  #app{display:flex;min-height:100vh;}
  @keyframes logoPulse{
    0%,100%{filter:drop-shadow(0 0 8px rgba(13,132,255,.6)) drop-shadow(0 0 2px rgba(255,94,0,.5));}
    50%{filter:drop-shadow(0 0 18px rgba(13,132,255,.95)) drop-shadow(0 0 8px rgba(255,94,0,.8));}
  }
  /* Sidebar */
  #sidebar{width:236px;background:var(--sidebar);border-right:2px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;}
  .logo-row{display:flex;align-items:center;gap:10px;margin:2px 6px 6px;}
  .logo-row svg{flex-shrink:0;animation:logoPulse 3s ease-in-out infinite;}
  #sidebar h1{font-size:20px;margin:0;font-weight:700;line-height:1.1;background:linear-gradient(90deg,#0d84ff,#00c2a8 50%,#ff5e00);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tagline{font-size:10.5px;color:var(--muted);margin:0 6px 20px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
  .nav-btn{--nav-color: var(--blue);display:flex;align-items:center;gap:10px;background:none;border:none;border-left:4px solid transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;margin-bottom:4px;width:100%;transition:all .12s;}
  .nav-btn:hover{background:var(--card-hover);color:var(--text);border-left-color:var(--nav-color);box-shadow:inset 0 0 14px -6px var(--nav-color);}
  .nav-btn.active{background:var(--nav-color);color:#0a1730;border-left-color:var(--nav-color);box-shadow:0 0 22px -1px var(--nav-color), 0 0 6px 0 var(--nav-color);}
  .nav-btn[data-page="dashboard"]{--nav-color:var(--blue);}
  .nav-btn[data-page="cards"]{--nav-color:var(--orange);}
  .nav-btn[data-page="funko"]{--nav-color:var(--pink);}
  .nav-btn[data-page="coins"]{--nav-color:var(--yellow);}
  .nav-btn[data-page="toys"]{--nav-color:var(--cyan);}
  .nav-btn[data-page="memorabilia"]{--nav-color:var(--green);}
  .nav-btn[data-page="breaks"]{--nav-color:var(--teal);}
  .nav-btn::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--nav-color);box-shadow:0 0 8px -1px var(--nav-color);flex-shrink:0;}
  .sidebar-footer{margin-top:auto;display:flex;flex-direction:column;gap:7px;padding-top:16px;border-top:2px solid var(--border);}
  .sidebar-footer button{background:var(--card);border:1.5px solid var(--border);color:var(--text);padding:9px 11px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;transition:all .15s;}
  .sidebar-footer button:hover{background:var(--card-hover);border-color:var(--blue);box-shadow:0 0 14px -4px var(--blue);}
  /* Mobile top bar (hidden on desktop) */
  #mobileTopBar{display:none;position:fixed;top:0;left:0;right:0;height:58px;background:var(--sidebar);border-bottom:2px solid var(--border);align-items:center;justify-content:space-between;padding:0 14px;z-index:70;}
  #mobileTopBar .mtb-brand{display:flex;align-items:center;gap:8px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;background:linear-gradient(90deg,#0d84ff,#00c2a8 50%,#ff5e00);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #mobileMenuBtn{background:var(--card);border:1.5px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
  #mobileMenuBtn span{display:block;width:18px;height:2px;border-radius:2px;background:var(--text);}
  #sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(5,2,12,.6);z-index:59;}
  /* Main */
  #content{margin-left:236px;flex:1;padding:28px 34px;max-width:1200px;}
  @media(max-width:860px){
    #mobileTopBar{display:flex;}
    #sidebar{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;transform:translateX(-100%);transition:transform .25s ease;z-index:71;box-shadow:10px 0 40px rgba(0,0,0,.5);padding-top:70px;}
    #sidebar.open{transform:translateX(0);}
    #sidebarOverlay.open{display:block;}
    #content{margin-left:0;padding:78px 16px 28px;max-width:100%;}
  }
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-header h2{margin:0;font-size:26px;font-weight:700;}
  .page-sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue),var(--orange));color:#fff;border:none;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px -3px rgba(13,132,255,.65);transition:transform .1s, box-shadow .1s;}
  .btn::after{content:'';position:absolute;top:0;left:-75%;width:50%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .55s ease;}
  .btn:hover::after{left:125%;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px -3px rgba(13,132,255,.85);}
  .btn.secondary{background:var(--card);border:1.5px solid var(--border);color:var(--text);box-shadow:none;}
  .btn.secondary::after{display:none;}
  .btn.secondary:hover{background:var(--card-hover);border-color:var(--cyan);transform:none;box-shadow:0 0 16px -4px var(--cyan);}
  .btn.danger{background:linear-gradient(135deg,var(--red),#c81d47);box-shadow:0 4px 20px -3px rgba(255,45,85,.65);}
  .btn.danger:hover{box-shadow:0 8px 28px -3px rgba(255,45,85,.85);}
  .btn.small{padding:7px 12px;font-size:12px;}
  /* Dashboard */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(13,132,255,.12), 0 6px 20px -8px rgba(13,132,255,.35);}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--cyan),var(--orange));box-shadow:0 0 12px 0 var(--blue);}
  .stat-card .label{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .stat-card .value{font-size:25px;font-weight:700;margin-top:6px;font-family:'Fredoka',sans-serif;color:var(--yellow);text-shadow:0 0 16px rgba(255,230,0,.5);}
  .stat-card .value.green{color:var(--green);text-shadow:0 0 16px rgba(0,255,157,.5);}
  .stat-card .value.red{color:var(--red);text-shadow:0 0 16px rgba(255,45,85,.5);}
  .green{color:var(--green);text-shadow:0 0 16px rgba(0,255,157,.5);}
  .red{color:var(--red);text-shadow:0 0 16px rgba(255,45,85,.5);}
  .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  @media(max-width:900px){.dash-grid{grid-template-columns:1fr;}}
  .panel{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;}
  .panel h3{margin:0 0 14px;font-size:16px;}
  .type-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .type-row:last-child{border-bottom:none;}
  .type-row .tname{display:flex;align-items:center;gap:8px;font-weight:600;}
  /* Filters */
  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .filter-bar input, .filter-bar select{background:var(--card);border:1.5px solid var(--border);color:var(--text);padding:9px 11px;border-radius:10px;font-size:13px;transition:box-shadow .15s, border-color .15s;}
  .filter-bar input[type="text"]{flex:1;min-width:160px;}
  .filter-bar input:focus, .filter-bar select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(13,132,255,.28);}
  /* Item grid */
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
  .item-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .12s, border-color .12s, box-shadow .12s;}
  .item-card:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 10px 32px -6px rgba(13,132,255,.65), 0 0 0 1px rgba(13,132,255,.35);}
  .item-thumb{width:100%;height:150px;background:linear-gradient(160deg,#081428,#0f2040);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:36px;}
  .item-thumb img{width:100%;height:100%;object-fit:cover;}
  .item-body{padding:11px 13px;}
  .item-title{font-size:13.5px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-meta{font-size:11.5px;color:var(--muted);margin-bottom:8px;}
  .item-foot{display:flex;justify-content:space-between;align-items:center;}
  .item-value{font-size:14.5px;font-weight:700;color:var(--yellow);text-shadow:0 0 12px rgba(255,230,0,.45);}
  .item-value.green{color:var(--green);text-shadow:0 0 12px rgba(0,255,157,.45);}
  .item-value.red{color:var(--red);text-shadow:0 0 12px rgba(255,45,85,.45);}
  .badge{font-size:10px;padding:4px 9px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .badge.owned{background:var(--blue);color:#fff;box-shadow:0 0 12px -2px var(--blue);}
  .badge.sold{background:var(--green);color:#052e1c;box-shadow:0 0 12px -2px var(--green);}
  .badge.traded{background:var(--orange);color:#3a1400;box-shadow:0 0 12px -2px var(--orange);}
  .badge.wishlist{background:var(--yellow);color:#3a2c00;box-shadow:0 0 12px -2px var(--yellow);}
  .badge.listed{background:var(--cyan);color:#00323a;box-shadow:0 0 12px -2px var(--cyan);}
  .qty-tag{color:var(--cyan);font-weight:700;}
  .backup-banner{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--yellow);color:#3a2c00;padding:12px 16px;border-radius:var(--radius);margin-bottom:18px;font-size:13.5px;font-weight:600;box-shadow:0 0 16px -4px var(--yellow);}
  .backup-banner-actions{display:flex;gap:8px;flex-shrink:0;}
  .backup-banner .btn{background:#3a2c00;box-shadow:none;}
  .backup-banner .btn.secondary{background:transparent;border:1.5px solid #3a2c00;color:#3a2c00;}
  .mono-badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:18px;padding:0 5px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.02em;background:var(--nav-color, var(--blue));color:#0a1730;box-shadow:0 0 10px -3px var(--nav-color, var(--blue));vertical-align:middle;}
  .badge.upcoming{background:var(--yellow);color:#3a2c00;box-shadow:0 0 12px -2px var(--yellow);}
  .badge.live{background:var(--teal);color:#00332c;box-shadow:0 0 12px -2px var(--teal);}
  .badge.completed{background:var(--green);color:#052e1c;box-shadow:0 0 12px -2px var(--green);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .big{font-size:44px;margin-bottom:10px;}
  .empty-state .big.mono-badge{display:inline-flex;width:70px;height:70px;min-width:70px;border-radius:18px;font-size:22px;letter-spacing:1px;margin:0 0 14px;}
  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(8,4,18,.78);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto;z-index:100;}
  .modal{background:var(--sidebar);border:2px solid var(--border);border-radius:20px;width:100%;max-width:620px;padding:26px 26px 20px;box-shadow:0 20px 70px -8px rgba(13,132,255,.4), 0 0 0 1px rgba(13,132,255,.2);}
  .modal h3{margin:0 0 4px;font-size:20px;}
  .modal .modal-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;}
  .field .req{color:var(--red);}
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field select, .field textarea{
    width:100%;background:var(--card);border:1.5px solid var(--border);color:var(--text);padding:9px 11px;border-radius:10px;font-size:13.5px;font-family:inherit;transition:box-shadow .15s, border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(13,132,255,.28);}
  .field textarea{resize:vertical;min-height:60px;}
  .field .help{color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.4;}
  .field.checkbox-field{display:flex;align-items:center;gap:8px;}
  .field.checkbox-field label{margin-bottom:0;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:520px){.field-row{grid-template-columns:1fr;}}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--cyan);margin:22px 0 12px;padding-top:14px;border-top:1px solid var(--border);text-shadow:0 0 10px rgba(0,240,255,.4);}
  .section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);}
  .modal-actions .left-actions{display:flex;gap:8px;}
  .modal-actions .right-actions{display:flex;gap:8px;}
  .close-x{position:absolute;top:18px;right:22px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
  .modal{position:relative;}
  /* Image upload */
  .image-upload-zone{border:2px dashed var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;background:var(--card);font-weight:600;transition:all .15s;}
  .image-upload-zone:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 0 18px -4px rgba(13,132,255,.5);}
  .image-preview-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .image-preview{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);}
  .image-preview img{width:100%;height:100%;object-fit:cover;}
  .image-preview .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1;}
  .lightbox-inner{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:94vw;}
  .lightbox-img{max-width:min(90vw,900px);max-height:78vh;border-radius:12px;box-shadow:0 20px 70px -8px rgba(13,132,255,.5);object-fit:contain;}
  .lightbox-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;}
  .lightbox-count{color:#fff;font-size:13px;font-weight:600;}
  /* Market value lookup */
  .lookup-box{background:var(--card);border:1.5px dashed var(--cyan);border-radius:12px;padding:12px 14px;margin-bottom:16px;box-shadow:0 0 18px -6px rgba(0,240,255,.45);}
  .lookup-box label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.4);}
  .lookup-btns{display:flex;gap:8px;flex-wrap:wrap;}
  /* Detail view */
  .detail-grid{display:grid;grid-template-columns:220px 1fr;gap:20px;}
  @media(max-width:520px){.detail-grid{grid-template-columns:1fr;}}
  .detail-images img{width:100%;border-radius:10px;margin-bottom:8px;border:1.5px solid var(--border);}
  .detail-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:13px;margin-top:6px;}
  .detail-facts .fk{color:var(--muted);}
  .value-history{margin-top:8px;font-size:12.5px;}
  .value-history-list{max-height:180px;overflow-y:auto;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:2px 12px;margin-top:4px;}
  .value-history-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .value-history-row:last-child{border-bottom:none;}
  /* Help modal */
  .help-content h4{font-size:14px;margin:16px 0 6px;color:var(--blue);text-shadow:0 0 10px rgba(13,132,255,.4);}
  .help-content h4:first-child{margin-top:0;}
  .help-content p{font-size:13px;color:var(--text);line-height:1.6;margin:0 0 8px;}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--card);border:1.5px solid var(--blue);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 6px 28px -4px rgba(13,132,255,.55);}
</style>
</head>
<body>
<div id="mobileTopBar">
  <div class="mtb-brand">
    <svg id="mtbLogo" width="22" height="22" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="mtbLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0d84ff"/>
          <stop offset="50%" stop-color="#00c2a8"/>
          <stop offset="100%" stop-color="#ff5e00"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="46" fill="url(#mtbLogoGrad)"/>
      <circle cx="50" cy="50" r="36" fill="#0a1730"/>
      <path d="M32 27 C32 44 40 53 50 53 C60 53 68 44 68 27 Z" fill="#ffe600" stroke="#fff" stroke-width="1.5"/>
      <rect x="47" y="53" width="6" height="13" fill="#ffe600" stroke="#fff" stroke-width="1.2"/>
      <rect x="35" y="65" width="30" height="7" rx="3.5" fill="#ffe600" stroke="#fff" stroke-width="1.2"/>
    </svg>
    <span id="mtbName">GrailKeeper</span>
  </div>
  <button id="mobileMenuBtn" aria-label="Open menu"><span></span><span></span><span></span></button>
</div>
<div id="sidebarOverlay"></div>
<div id="app">
  <nav id="sidebar">
    <div class="logo-row">
      <svg width="38" height="38" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d84ff"/>
            <stop offset="50%" stop-color="#00c2a8"/>
            <stop offset="100%" stop-color="#ff5e00"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="url(#logoGrad)"/>
        <circle cx="50" cy="50" r="36" fill="#0a1730"/>
        <path d="M32 27 C32 44 40 53 50 53 C60 53 68 44 68 27 Z" fill="#ffe600" stroke="#fff" stroke-width="1.5"/>
        <rect x="47" y="53" width="6" height="13" fill="#ffe600" stroke="#fff" stroke-width="1.2"/>
        <rect x="35" y="65" width="30" height="7" rx="3.5" fill="#ffe600" stroke="#fff" stroke-width="1.2"/>
        <path d="M50 10 L53 17 L60 18 L54.5 23 L56 30 L50 26.5 L44 30 L45.5 23 L40 18 L47 17 Z" fill="#fff"/>
        <circle cx="82" cy="18" r="3.5" fill="#00f0ff"/>
        <circle cx="16" cy="78" r="2.5" fill="#ff5e00"/>
      </svg>
      <h1>GrailKeeper</h1>
    </div>
    <div class="tagline">Catalog Your Collection</div>
    <button class="nav-btn active" data-page="dashboard">Dashboard</button>
    <button class="nav-btn" data-page="cards">Trading Cards</button>
    <button class="nav-btn" data-page="funko">Funko Pops</button>
    <button class="nav-btn" data-page="coins">Coins &amp; Bullion</button>
    <button class="nav-btn" data-page="toys">Toys</button>
    <button class="nav-btn" data-page="memorabilia">Memorabilia</button>
    <button class="nav-btn" data-page="breaks">Card Breaks</button>
    <div class="sidebar-footer">
      <button id="showReportsBtn">Show Reports</button>
      <button id="helpBtn">Help / Guide</button>
      <button id="exportBtn">Export Backup</button>
      <button id="importBtn">Import Backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </nav>
  <main id="content"></main>

/* ========================= INDEXEDDB LAYER ========================= */

// Items are stored WITHOUT their full-size photos — each item only carries a small
// "thumb" string for list views. Full-resolution photos live in a separate 'images'
// store keyed by item id, and are only loaded when you actually open that item. This
// keeps loading/scrolling fast even with thousands of items in a collection.
function openDB(){
  return new Promise((resolve, reject)=>{
    // Version 2 added the 'images' store. Version 3 adds the 'breaks' store (for the
    // Card Breaks P&L log). Bumping this number is what makes browsers that already
    // created the database at an older version run onupgradeneeded again and get the
    // missing store(s) — without touching any existing data. If this number is ever
    // bumped again for a future schema change, it must keep going up (4, 5, ...), never
    // back down, or existing users' browsers will never receive the upgrade.
    // Internal database name is kept as 'stashDexDB' on purpose even after the app
    // was renamed to GrailKeeper — it's never shown to users, and changing it would
    // point everyone at a brand-new empty database, silently losing existing local data.
    const req = indexedDB.open('stashDexDB', 3);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('items')){
        const store = db.createObjectStore('items', {keyPath:'id'});
        store.createIndex('type', 'type', {unique:false});
      }
      if(!db.objectStoreNames.contains('images')){
        db.createObjectStore('images', {keyPath:'id'});
      }
      if(!db.objectStoreNames.contains('breaks')){
        db.createObjectStore('breaks', {keyPath:'id'});
      }
    };
    req.onblocked = ()=>{
      toast('Waiting on another open tab of this app to finish updating — close other tabs of this page, then reload.', 8000);
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
}

// Every db* helper below awaits this before touching anything, instead of reading the
// module-level DB variable directly. It's memoized (openDB() only ever actually runs
// once) and resolves the moment the database is ready. This matters because the
// Import/Export buttons (and other actions) are wired up to their click handlers as
// soon as the page parses — before init()'s "DB = await openDB()" has necessarily
// finished — so a fast click right after load could previously call DB.transaction()
// while DB was still null, throwing "Cannot read properties of null (reading
// 'transaction')". Routing every db* call through ensureDB() means it just waits for
// the database instead of failing.
function ensureDB(){
  if(!dbReadyPromise){
    dbReadyPromise = openDB().then((db)=>{ DB = db; return db; });
  }
  return dbReadyPromise;
}

async function dbGetAll(){
  const db = await ensureDB();

    const tx = db.transaction('items','readonly');
    const req = tx.objectStore('items').getAll();

    req.onerror = ()=> reject(req.error);
  });
}

}

/* ========================= HELPERS ========================= */

function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

function fmtCurrency(n){
  n = Number(n)||0;
  // Format the sign OUTSIDE the $ so negative values read as "-$50.00", not the
  // confusing "$-50.00" that toLocaleString's built-in minus sign would produce.
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

function esc(s){
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

function toast(msg, duration=2600){
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.maxWidth = '360px';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), duration);
}

function resizeImage(file, maxDim=900, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim/w); w = maxDim; }
          else { w = Math.round(w * maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Shrinks an already-loaded image (a full-size dataURL) down to a small thumbnail
// used only for grid cards, so list views stay light even with thousands of photos.
function makeThumb(dataUrl, maxDim=220, quality=0.6){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=> resolve('');
    img.src = dataUrl;
  });
}

function itemsForType(type){
  return ALL_ITEMS.filter(i=>i.type===type);
}

// "Listed" items are still physically owned (just up for sale), so they count
// alongside "owned" for ownership/value totals. Only "wishlist" (not yet bought)
// and items no longer in hand (sold/traded) are excluded from different totals.
function isOwnedLike(item){
  return item.status === 'owned' || item.status === 'listed';
}
function totalSpent(items){
  // Wishlist items haven't actually been bought yet, so they don't count as spend.
  return items.filter(i=> i.status !== 'wishlist').reduce((s,i)=> s + (Number(i.purchasePrice)||0), 0);
}
function totalCurrentValue(items){
  // currentValue is a per-unit estimate, so multiply by quantity for true collection value.
  return items.filter(isOwnedLike).reduce((s,i)=> s + (Number(i.currentValue)||0) * (Number(i.quantity)||1), 0);
}
function totalSaleProceeds(items){
  // Items with a saleLog (sold via "Quick Sell 1 Unit") may have multiple partial sales;
  // sum those directly instead of the single salePrice field to avoid double-counting.
  return items.reduce((s,i)=>{
    if(i.saleLog && i.saleLog.length) return s + i.saleLog.reduce((s2,l)=> s2 + (Number(l.price)||0), 0);
    if(i.status === 'sold') return s + (Number(i.salePrice)||0);
    return s;
  }, 0);
}
function totalActiveListings(items){
  return items.filter(i=>i.status==='listed').length;
}

      <div class="stat-card"><div class="label">Break Profit / Loss (All-Time)</div><div class="value ${breakNet>=0?'green':'red'}">${breakNet>=0?'+':''}${fmtCurrency(breakNet)}</div></div>

    </div>` : ''}
  `;
}

// Merges every currently owned/listed item's saved value-history entries into a single
// running portfolio-value-over-time series. Sold/traded items are excluded, and items
// with only their original single value entry don't add a meaningful data point, so this
// is a directional trend rather than a perfectly reconstructed historical total.
function computePortfolioValueTrend(){
  const events = [];
  ALL_ITEMS.filter(isOwnedLike).forEach(item=>{
    const qty = Number(item.quantity) || 1;
    (item.valueHistory || []).forEach(h=>{
      events.push({date: h.date, itemId: item.id, total: (Number(h.value)||0) * qty});
    });
  });
  if(events.length < 2) return [];
  events.sort((a,b)=> a.date.localeCompare(b.date));
  const lastValueByItem = {};
  const byDate = new Map();
  events.forEach(e=>{
    lastValueByItem[e.itemId] = e.total;
    const runningTotal = Object.values(lastValueByItem).reduce((s,v)=> s+v, 0);
    byDate.set(e.date, runningTotal);
  });
  return Array.from(byDate.entries()).map(([date,total])=>({date,total}));
}

let trendChartInstance = null;
function renderTrendChart(){
  const canvas = document.getElementById('trendChart');
  if(!canvas || typeof Chart === 'undefined') return;
  if(trendChartInstance) trendChartInstance.destroy();
  const points = computePortfolioValueTrend();
  trendChartInstance = new Chart(canvas, {
    type: 'line',
    data:{
      labels: points.map(p=> fmtDate(p.date)),
      datasets:[{ data: points.map(p=>p.total), borderColor:'#0d84ff', backgroundColor:'rgba(13,132,255,.18)', fill:true, tension:.25, pointRadius:2 }]
    },
    options:{
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ ticks:{ color:'#8fb0da', font:{size:10} }, grid:{ color:'rgba(143,176,218,.12)' } },
        y:{ ticks:{ color:'#8fb0da', font:{size:10}, callback:(v)=> fmtCurrency(v) }, grid:{ color:'rgba(143,176,218,.12)' } }
      }
    }
  });
}

const PAGE_SIZE = 60; // items rendered per "page" — keeps the grid fast with large collections

function getFilterState(type){
  window.__filters = window.__filters || {};
  window.__filters[type] = window.__filters[type] || {search:'', status:'', sort:'newest', visibleCount: PAGE_SIZE};
  return window.__filters[type];
}

function renderCollectionPage(type){
  const meta = TYPE_META[type];
  const filters = getFilterState(type);
  let items = itemsForType(type);

  if(filters.search){
    const q = filters.search.toLowerCase();
    items = items.filter(i=>{
      const hay = [i.name, ...(CATEGORY_CONFIG[type].map(f=>i.fields?.[f.key]))].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(filters.status){
    items = items.filter(i=> i.status === filters.status);
  }
  items = items.slice().sort((a,b)=>{
    if(filters.sort==='newest') return (b.createdAt||0)-(a.createdAt||0);
    if(filters.sort==='oldest') return (a.createdAt||0)-(b.createdAt||0);
    if(filters.sort==='value-high') return (Number(b.currentValue)||0)-(Number(a.currentValue)||0);
    if(filters.sort==='value-low') return (Number(a.currentValue)||0)-(Number(b.currentValue)||0);
    if(filters.sort==='name') return (a.name||'').localeCompare(b.name||'');
    return 0;
  });

  const matchCount = items.length;
  const visible = items.slice(0, filters.visibleCount);
  const cards = visible.map(i=> renderItemCard(type, i)).join('');
  const totalVal = totalCurrentValue(itemsForType(type));
  const totalSp = totalSpent(itemsForType(type));
  const remaining = matchCount - visible.length;

  return `
    <div class="page-header">
      <div>
        <h2>${meta.label}</h2>
        <div class="page-sub">${meta.desc} · ${itemsForType(type).length} items · ${fmtCurrency(totalVal)} current value · ${fmtCurrency(totalSp)} spent</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn secondary" id="templateCSVBtn">Download Template</button>
        <button class="btn secondary" id="importCSVBtn">Import CSV</button>
        <input type="file" id="importCSVFile" accept=".csv,text/csv" style="display:none">
        <button class="btn secondary" id="exportWhatnotBtn">Whatnot CSV</button>
        <button class="btn" id="addItemBtn">+ Add Item</button>
      </div>
    </div>
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search ${meta.label.toLowerCase()}..." value="${esc(filters.search)}">
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="owned" ${filters.status==='owned'?'selected':''}>Owned</option>
        <option value="listed" ${filters.status==='listed'?'selected':''}>Listed For Sale</option>
        <option value="sold" ${filters.status==='sold'?'selected':''}>Sold</option>
        <option value="traded" ${filters.status==='traded'?'selected':''}>Traded</option>
        <option value="wishlist" ${filters.status==='wishlist'?'selected':''}>Wishlist</option>
      </select>
      <select id="sortFilter">
        <option value="newest" ${filters.sort==='newest'?'selected':''}>Newest First</option>
        <option value="oldest" ${filters.sort==='oldest'?'selected':''}>Oldest First</option>
        <option value="value-high" ${filters.sort==='value-high'?'selected':''}>Value: High to Low</option>
        <option value="value-low" ${filters.sort==='value-low'?'selected':''}>Value: Low to High</option>
        <option value="name" ${filters.sort==='name'?'selected':''}>Name A-Z</option>
      </select>
    </div>
    ${matchCount ? `<div class="item-grid">${cards}</div>
      ${remaining > 0 ? `<div style="text-align:center;margin-top:22px;">
        <button class="btn secondary" id="loadMoreBtn">Load ${Math.min(remaining, PAGE_SIZE)} More (${remaining} left)</button>
      </div>` : ''}
    ` : `
      <div class="empty-state">
        <div class="big mono-badge" style="--nav-color:var(${typeColorVar(type)});">${meta.icon}</div>
        <p>No items match yet. Click "+ Add Item" to start tracking your ${meta.label.toLowerCase()}.</p>
      </div>`}
  `;
}

function renderItemCard(type, item){
  const img = item.thumb;
  let metaText = subtitleFor(type, item);
  if(item.status==='listed' && item.listingStage) metaText += ' · ' + item.listingStage;
  let shownValue = item.currentValue;
  if(item.status==='sold') shownValue = item.salePrice;
  else if(item.status==='listed' && item.listingPrice) shownValue = item.listingPrice;
  const qty = Number(item.quantity);
  const qtyTag = (qty && qty > 1) ? `<span class="qty-tag">×${qty} in stock</span>` : '';
  return `
    <div class="item-card" data-id="${item.id}">
      <div class="item-thumb">${img ? `<img src="${img}" alt="" loading="lazy">` : `<span class="mono-badge" style="--nav-color:var(${typeColorVar(type)});width:36px;height:36px;font-size:13px;border-radius:10px;">${TYPE_META[type].icon}</span>`}</div>
      <div class="item-body">
        <div class="item-title">${esc(item.name || 'Untitled')}</div>
        <div class="item-meta">${esc(metaText)}${qtyTag ? ' · ' : ''}${qtyTag}</div>
        <div class="item-foot">
          <span class="item-value">${fmtCurrency(shownValue)}</span>
          <span class="badge ${item.status}">${item.status}</span>
        </div>
      </div>
    </div>
  `;
}

function subtitleFor(type, item){
  const f = item.fields || {};
  if(type==='cards') return [f.year, f.brand, f.player].filter(Boolean).join(' · ') || 'Trading Card';
  if(type==='funko') return [f.license, f.character].filter(Boolean).join(' · ') || 'Funko Pop';
  if(type==='coins') return [f.year, f.metal, f.denomination].filter(Boolean).join(' · ') || 'Coin / Bullion';
  if(type==='toys') return [f.brand, f.character].filter(Boolean).join(' · ') || 'Toy';
  if(type==='memorabilia') return [f.player, f.category, f.event].filter(Boolean).join(' · ') || 'Memorabilia';
  return '';
}

function attachPageEvents(){
  if(currentPage === 'dashboard') return;
  if(currentPage === 'breaks'){ attachBreaksPageEvents(); return; }
  const type = currentPage;
  const addBtn = document.getElementById('addItemBtn');
  if(addBtn) addBtn.addEventListener('click', ()=> openItemModal(type, null));

  const exportWhatnotBtn = document.getElementById('exportWhatnotBtn');
  if(exportWhatnotBtn) exportWhatnotBtn.addEventListener('click', ()=> exportWhatnotCSV(type));

  const templateCSVBtn = document.getElementById('templateCSVBtn');
  if(templateCSVBtn) templateCSVBtn.addEventListener('click', ()=> downloadCSVTemplate(type));
  const importCSVBtn = document.getElementById('importCSVBtn');
  if(importCSVBtn) importCSVBtn.addEventListener('click', ()=> document.getElementById('importCSVFile').click());
  const importCSVFile = document.getElementById('importCSVFile');
  if(importCSVFile) importCSVFile.addEventListener('change', (e)=> handleBulkImportCSV(e, type));

  const searchInput = document.getElementById('searchInput');
  if(searchInput) searchInput.addEventListener('input', (e)=>{
    const f = getFilterState(type);
    f.search = e.target.value;
    f.visibleCount = PAGE_SIZE;
    render();
    document.getElementById('searchInput').focus();
    const val = document.getElementById('searchInput').value;
    document.getElementById('searchInput').setSelectionRange(val.length, val.length);
  });
  const statusFilter = document.getElementById('statusFilter');
  if(statusFilter) statusFilter.addEventListener('change', (e)=>{
    const f = getFilterState(type);
    f.status = e.target.value; f.visibleCount = PAGE_SIZE; render();
  });
  const sortFilter = document.getElementById('sortFilter');
  if(sortFilter) sortFilter.addEventListener('change', (e)=>{
    const f = getFilterState(type);
    f.sort = e.target.value; f.visibleCount = PAGE_SIZE; render();
  });
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  if(loadMoreBtn) loadMoreBtn.addEventListener('click', ()=>{
    getFilterState(type).visibleCount += PAGE_SIZE;
    render();
  });

  document.querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', ()=> openItemModal(type, card.dataset.id));
  });
}

// Builds a search string from the form's current values (name + the most identifying
// category fields) so the market-value lookup buttons return relevant results.
function buildSearchQuery(type){
  const form = document.getElementById('itemForm');
  const fd = new FormData(form);
  const name = (fd.get('name') || '').trim();
  let extraKeys = [];
  if(type === 'cards') extraKeys = ['year','brand','player','setName','cardNumber'];
  else if(type === 'funko') extraKeys = ['license','character','popNumber'];
  else if(type === 'coins') extraKeys = ['year','denomination','metal','country'];
  else if(type === 'toys') extraKeys = ['brand','character','edition'];
  else if(type === 'memorabilia') extraKeys = ['player','team','event','category'];
  const extra = extraKeys.map(k=> (fd.get(k)||'').trim()).filter(Boolean).join(' ');
  return [name, extra].filter(Boolean).join(' ').trim();
}

async function handleImageUpload(e){
  const files = Array.from(e.target.files || []);
  for(const file of files){
    try{
      const dataUrl = await resizeImage(file);
      pendingImages.push(dataUrl);
    }catch(err){ console.error('Image processing failed', err); }
  }
  renderImagePreviews();
  e.target.value = '';
}

function renderImagePreviews(){
  const row = document.getElementById('previewRow');
  if(!row) return;
  row.innerHTML = pendingImages.map((img, idx)=>`
    <div class="image-preview">
      <img src="${img}" alt="" data-idx="${idx}" style="cursor:zoom-in;">
      <button type="button" class="rm" data-idx="${idx}">✕</button>
    </div>
  `).join('');
  row.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      pendingImages.splice(Number(btn.dataset.idx), 1);
      renderImagePreviews();
    });
  });
  row.querySelectorAll('.image-preview img').forEach(img=>{
    img.addEventListener('click', ()=> openImageLightbox(pendingImages, Number(img.dataset.idx)));
  });
}

// Full-size photo viewer — the small preview thumbnails and grid thumbnails are too
// small to actually check a grading label or condition detail against. Stacks above
// the item modal via #confirmRoot. Supports left/right arrow keys when there's more
// than one photo.
function openImageLightbox(images, startIndex){
  if(!images || !images.length) return;
  let idx = startIndex || 0;
  const root = document.getElementById('confirmRoot');

  const renderLightbox = ()=>{
    root.innerHTML = `
      <div class="modal-overlay" id="lightboxOverlay" style="z-index:300;background:rgba(2,6,15,.93);">
        <div class="lightbox-inner">
          <img src="${images[idx]}" alt="" class="lightbox-img">
          <div class="lightbox-controls">
            <button type="button" class="btn secondary small" id="lightboxClose">Close</button>
            ${images.length > 1 ? `
              <button type="button" class="btn secondary small" id="lightboxPrev">‹ Prev</button>
              <span class="lightbox-count">${idx+1} / ${images.length}</span>
              <button type="button" class="btn secondary small" id="lightboxNext">Next ›</button>
            ` : ''}
          </div>
        </div>
      </div>
    `;
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxOverlay').addEventListener('click', (e)=>{ if(e.target.id==='lightboxOverlay') closeLightbox(); });
    const prevBtn = document.getElementById('lightboxPrev');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ idx = (idx-1+images.length)%images.length; renderLightbox(); });
    const nextBtn = document.getElementById('lightboxNext');
    if(nextBtn) nextBtn.addEventListener('click', ()=>{ idx = (idx+1)%images.length; renderLightbox(); });
  };

  const escHandler = (e)=>{
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowLeft' && images.length > 1){ idx = (idx-1+images.length)%images.length; renderLightbox(); }
    else if(e.key === 'ArrowRight' && images.length > 1){ idx = (idx+1)%images.length; renderLightbox(); }
  };
  function closeLightbox(){
    document.removeEventListener('keydown', escHandler);
    root.innerHTML = '';
  }

  document.addEventListener('keydown', escHandler);
  renderLightbox();
}

// Pressing Escape closes whichever modal is currently open. Bound each time a modal
// opens and torn down in closeModal(), so it never leaks a stray listener.
let _modalEscHandler = null;
function bindModalEscape(){
  unbindModalEscape();
  _modalEscHandler = (e)=>{ if(e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', _modalEscHandler);
}
function unbindModalEscape(){
  if(_modalEscHandler){ document.removeEventListener('keydown', _modalEscHandler); _modalEscHandler = null; }
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  editingItemId = null;
  pendingImages = [];
  unbindModalEscape();
}

// Themed replacement for window.confirm() — matches the app's own modal styling
// instead of popping a plain OS dialog. Renders into #confirmRoot so it can stack
// on top of an already-open item/break modal (e.g. confirming a delete from the
// edit form) without disturbing it. Resolves true/false.
function openConfirmModal({title, message, confirmLabel='Confirm', cancelLabel='Cancel', danger=false}){
  return new Promise((resolve)=>{
    const root = document.getElementById('confirmRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="confirmOverlay" style="z-index:200;">
        <div class="modal" style="max-width:420px;">
          <h3>${esc(title)}</h3>
          <div class="modal-sub">${esc(message)}</div>
          <div class="modal-actions">
            <div class="left-actions"><span></span></div>
            <div class="right-actions">
              <button type="button" class="btn secondary small" id="confirmCancelBtn">${esc(cancelLabel)}</button>
              <button type="button" class="btn ${danger?'danger':''} small" id="confirmOkBtn">${esc(confirmLabel)}</button>
            </div>
          </div>
        </div>
      </div>
    `;
    const escHandler = (e)=>{ if(e.key === 'Escape') finish(false); };
    const finish = (result)=>{
      document.removeEventListener('keydown', escHandler);
      root.innerHTML = '';
      resolve(result);
    };
    document.getElementById('confirmOkBtn').addEventListener('click', ()=> finish(true));
    document.getElementById('confirmCancelBtn').addEventListener('click', ()=> finish(false));
    document.getElementById('confirmOverlay').addEventListener('click', (e)=>{ if(e.target.id==='confirmOverlay') finish(false); });
    document.addEventListener('keydown', escHandler);
    document.getElementById('confirmOkBtn').focus();
  });
}

async function handleFormSubmit(e, type){
  e.preventDefault();
  const form = e.target;
  const submitBtn = form.querySelector('button[type="submit"]');
  if(submitBtn && submitBtn.disabled) return; // already mid-submit — ignore a rapid double-click
  const fd = new FormData(form);

  const name = fd.get('name')?.trim();
  if(!name){ toast('Item name is required.'); return; }

  if(submitBtn) submitBtn.disabled = true;
  const existing = editingItemId ? ALL_ITEMS.find(i=>i.id===editingItemId) : null;
  const now = Date.now();

  const fields = {};
  CATEGORY_CONFIG[type].forEach(f=>{
    if(f.type === 'checkbox'){ fields[f.key] = fd.get(f.key) === 'on'; }
    else { fields[f.key] = fd.get(f.key) || ''; }
  });

  let quantity = fd.get('quantity');
  quantity = (quantity === '' || quantity == null) ? 1 : Number(quantity);
  if(!Number.isFinite(quantity) || quantity < 0) quantity = 0;

  const newCurrentValue = Number(fd.get('currentValue')) || 0;
  let valueHistory = existing ? (existing.valueHistory || []) : [];
  if(!existing || Number(existing.currentValue) !== newCurrentValue){
    valueHistory = valueHistory.concat([{date: new Date().toISOString().slice(0,10), value: newCurrentValue}]);
  }

  const tagsRaw = fd.get('tags') || '';
  const tags = tagsRaw.split(',').map(t=>t.trim()).filter(Boolean);

  // Only a small thumbnail is stored on the item itself (for fast grid rendering);
  // the full-size photos are saved separately, keyed by this item's id.
  const thumb = pendingImages.length ? await makeThumb(pendingImages[0]) : '';

  const item = {
    id: existing ? existing.id : uuid(),
    type,
    name,
    thumb,
    status: fd.get('status'),
    dateAcquired: fd.get('dateAcquired') || '',
    quantity,
    purchasePrice: Number(fd.get('purchasePrice')) || 0,
    source: fd.get('source') || '',
    currentValue: newCurrentValue,
    valueHistory,
    saleLog: existing ? (existing.saleLog || []) : [],
    dateListed: fd.get('dateListed') || '',
    listingPlatform: fd.get('listingPlatform') || '',
    listingStage: fd.get('listingStage') || '',
    listingPrice: Number(fd.get('listingPrice')) || 0,
    listingUrl: fd.get('listingUrl') || '',
    dateSold: fd.get('dateSold') || '',
    salePrice: Number(fd.get('salePrice')) || 0,
    salePlatform: fd.get('salePlatform') || '',
    saleBuyer: fd.get('saleBuyer') || '',
    showEvent: fd.get('showEvent') || '',
    dateTraded: fd.get('dateTraded') || '',
    tradePartner: fd.get('tradePartner') || '',
    tradedFor: fd.get('tradedFor') || '',
    tags,
    notes: fd.get('notes') || '',
    fields,
    createdAt: existing ? existing.createdAt : now,
    updatedAt: now
  };

  try{
    await dbPut(item);
    await dbPutImages(item.id, pendingImages);
    await refreshItems();
    closeModal();
    render();
    toast(existing ? 'Item updated.' : 'Item added.');
  }catch(err){
    console.error('Failed to save item', err);
    if(submitBtn) submitBtn.disabled = false;
    toast(`Could not save this item — ${err.message || 'an unexpected error occurred'}. Please try again.`, 6000);
  }
}

async function handleDelete(id){
  const ok = await openConfirmModal({
    title: 'Delete this item?',
    message: 'This item and its photos will be permanently deleted. This cannot be undone.',
    confirmLabel: 'Delete',
    danger: true
  });

  await dbDelete(id);

}

// Sells exactly one unit of a duplicate/bulk-stock item: logs the sale to saleLog,
// decrements quantity, and — once stock hits 0 — flips status to "Sold" and mirrors
// the last sale into the legacy salePrice/dateSold/salePlatform fields so it still
// displays correctly anywhere those single-sale fields are shown.
async function handleQuickSell(id){
  const item = ALL_ITEMS.find(i=>i.id===id);
  if(!item) return;
  const qty = Number(item.quantity) || 0;
  if(qty < 1){ toast('No units left in stock to sell.'); return; }

  const result = await openQuickSellModal(item);
  if(!result) return; // cancelled
  const { price, platform, showEvent } = result;

  const saleLog = (item.saleLog || []).concat([{date: new Date().toISOString().slice(0,10), price, platform, showEvent}]);
  const newQty = qty - 1;
  const updated = Object.assign({}, item, {quantity: newQty, saleLog, updatedAt: Date.now()});
  if(newQty <= 0){
    updated.status = 'sold';
    updated.dateSold = new Date().toISOString().slice(0,10);
    updated.salePrice = price;
    updated.salePlatform = platform || updated.salePlatform;
    updated.showEvent = showEvent || updated.showEvent;
  }

  await dbPut(updated);
  await refreshItems();
  closeModal();
  render();
  toast(newQty <= 0 ? 'Last unit sold — status set to Sold.' : `Sold 1 unit for ${fmtCurrency(price)}. ${newQty} left in stock.`);
}

/* ========================= CARD BREAKS ========================= */

function breakNetProfit(b){
  return (Number(b.spotRevenue)||0) - (Number(b.boxCost)||0) - (Number(b.platformFees)||0) - (Number(b.shippingCost)||0);
}

function breakStatusSlug(status){
  if(status === 'Upcoming') return 'upcoming';
  if(status === 'Live / Selling Spots') return 'live';
  if(status === 'Completed') return 'completed';
  return 'upcoming';
}

function totalBreakBoxCost(breaks){ return breaks.reduce((s,b)=> s + (Number(b.boxCost)||0), 0); }
function totalBreakRevenue(breaks){ return breaks.reduce((s,b)=> s + (Number(b.spotRevenue)||0), 0); }
function totalBreakNetProfit(breaks){ return breaks.reduce((s,b)=> s + breakNetProfit(b), 0); }

function renderBreaksPage(){
  const filters = getFilterState('breaks');
  const allBreaks = ALL_BREAKS;
  let breaks = allBreaks.slice();

  if(filters.search){
    const q = filters.search.toLowerCase();
    breaks = breaks.filter(b=> [b.title, b.product, b.notes].filter(Boolean).join(' ').toLowerCase().includes(q));
  }
  if(filters.status){
    breaks = breaks.filter(b=> b.status === filters.status);
  }
  breaks = breaks.slice().sort((a,b)=>{
    if(filters.sort==='newest') return (b.createdAt||0)-(a.createdAt||0);
    if(filters.sort==='oldest') return (a.createdAt||0)-(b.createdAt||0);
    if(filters.sort==='net-high') return breakNetProfit(b)-breakNetProfit(a);
    if(filters.sort==='net-low') return breakNetProfit(a)-breakNetProfit(b);
    if(filters.sort==='title') return (a.title||'').localeCompare(b.title||'');
    return 0;
  });

  const matchCount = breaks.length;
  const visible = breaks.slice(0, filters.visibleCount);
  const cards = visible.map(renderBreakCard).join('');
  const remaining = matchCount - visible.length;
  const netAll = totalBreakNetProfit(allBreaks);

  return `
    <div class="page-header">
      <div>
        <h2>Card Breaks</h2>
        <div class="page-sub">Break-level cost &amp; profit/loss tracking · ${allBreaks.length} breaks logged. Per-spot buyers and fulfillment stay in your break platform (Whatnot, eBay Live, etc) — this is just your back-office P&amp;L.</div>
      </div>
      <button class="btn" id="addBreakBtn">+ Log Break</button>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total Breaks</div><div class="value">${allBreaks.length}</div></div>
      <div class="stat-card"><div class="label">Total Box Cost</div><div class="value">${fmtCurrency(totalBreakBoxCost(allBreaks))}</div></div>
      <div class="stat-card"><div class="label">Total Spot Revenue</div><div class="value">${fmtCurrency(totalBreakRevenue(allBreaks))}</div></div>
      <div class="stat-card"><div class="label">Net Profit / Loss</div><div class="value ${netAll>=0?'green':'red'}">${netAll>=0?'+':''}${fmtCurrency(netAll)}</div></div>
    </div>
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search breaks..." value="${esc(filters.search)}">
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Upcoming" ${filters.status==='Upcoming'?'selected':''}>Upcoming</option>
        <option value="Live / Selling Spots" ${filters.status==='Live / Selling Spots'?'selected':''}>Live / Selling Spots</option>
        <option value="Completed" ${filters.status==='Completed'?'selected':''}>Completed</option>
      </select>
      <select id="sortFilter">
        <option value="newest" ${filters.sort==='newest'?'selected':''}>Newest Logged</option>
        <option value="oldest" ${filters.sort==='oldest'?'selected':''}>Oldest Logged</option>
        <option value="net-high" ${filters.sort==='net-high'?'selected':''}>Net P/L: High to Low</option>
        <option value="net-low" ${filters.sort==='net-low'?'selected':''}>Net P/L: Low to High</option>
        <option value="title" ${filters.sort==='title'?'selected':''}>Title A-Z</option>
      </select>
    </div>
    ${matchCount ? `<div class="item-grid">${cards}</div>
      ${remaining > 0 ? `<div style="text-align:center;margin-top:22px;">
        <button class="btn secondary" id="loadMoreBtn">Load ${Math.min(remaining, PAGE_SIZE)} More (${remaining} left)</button>
      </div>` : ''}
    ` : `
      <div class="empty-state">
        <div class="big mono-badge" style="--nav-color:var(--teal);">BR</div>
        <p>${allBreaks.length===0 ? 'No breaks logged yet. Click "+ Log Break" to track your first one.' : 'No breaks match your search/filter.'}</p>
      </div>`}
  `;
}

function renderBreakCard(b){
  const net = breakNetProfit(b);
  return `
    <div class="item-card" data-id="${b.id}">
      <div class="item-thumb"><span class="mono-badge" style="--nav-color:var(--teal);width:36px;height:36px;font-size:13px;border-radius:10px;">BR</span></div>

          <span class="badge ${breakStatusSlug(b.status)}">${esc(b.status || 'Upcoming')}</span>

// Minimal RFC4180-ish CSV parser — handles quoted fields containing commas,
// escaped double-quotes (""), and both \n and \r\n line endings.
function parseCSV(text){
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* ignore — \n handles the actual row break */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}

// Columns a bulk-import CSV can use for a given collection type — the common fields
// every item has, plus that type's own category-specific fields.
function csvImportColumns(type){
  return ['name','quantity','dateAcquired','purchasePrice','source','currentValue','status','tags','notes']
    .concat(CATEGORY_CONFIG[type].map(f=>f.key));
}

async function downloadCSVTemplate(type){
  const cols = csvImportColumns(type);
  const exampleRow = cols.map(col=>{
    if(col==='name') return 'Example Item Name';
    if(col==='quantity') return '1';
    if(col==='status') return 'owned';
    const cfg = CATEGORY_CONFIG[type].find(f=>f.key===col);
    if(cfg && cfg.type==='select' && cfg.options && cfg.options.length) return cfg.options[0];
    if(cfg && cfg.type==='checkbox') return 'false';
    return '';
  });
  const rows = [cols.map(csvField).join(','), exampleRow.map(csvField).join(',')];
  const csv = rows.join('\r\n');
  const filename = `grailkeeper-${type}-import-template.csv`;
  const blob = new Blob([csv], {type:'text/csv'});

  let sharedViaNative = false;
  if(navigator.canShare && navigator.share){
    try{
      const file = new File([blob], filename, {type:'text/csv'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Import Template'});
        sharedViaNative = true;
      }
    }catch(shareErr){
      if(shareErr && shareErr.name === 'AbortError'){ return; }
      console.error('Native share failed, falling back to direct download', shareErr);
    }
  }
  if(!sharedViaNative){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  toast('Template downloaded. Fill it in using the same column headers, then use "Import CSV" to load it. For dropdown-style fields, match one of the exact option values shown in the example row — anything else will show blank when you later edit that item.', 8000);
}

async function handleBulkImportCSV(e, type){
  const file = e.target.files[0];
  if(!file) return;
  try{
    let text = await file.text();
    text = text.replace(/^﻿/, '').trim();
    if(!text){ toast('That CSV file is empty.', 5000); e.target.value=''; return; }

    const rows = parseCSV(text);
    if(rows.length < 2){ toast('That CSV needs a header row plus at least one item row.', 5000); e.target.value=''; return; }

    const headers = rows[0].map(h=> h.trim());
    const headerIndex = {};
    headers.forEach((h,i)=>{ headerIndex[h.toLowerCase()] = i; });
    if(headerIndex['name'] === undefined){
      toast('That CSV is missing a "name" column, which is required. Try "Download Template" for the exact column headers this collection expects.', 8000);
      e.target.value=''; return;
    }

    const categoryFields = CATEGORY_CONFIG[type];
    const checkboxKeys = new Set(categoryFields.filter(f=>f.type==='checkbox').map(f=>f.key));
    const dataRows = rows.slice(1).filter(r=> r.some(c=> c && c.trim()));

    const itemsToImport = [];
    let skipped = 0;
    dataRows.forEach(row=>{
      const get = (key)=>{
        const idx = headerIndex[key.toLowerCase()];
        return idx !== undefined ? (row[idx] || '').trim() : '';
      };
      const name = get('name');
      if(!name){ skipped++; return; }

      const fields = {};
      categoryFields.forEach(f=>{
        const raw = get(f.key);
        fields[f.key] = checkboxKeys.has(f.key) ? ['true','yes','1','y'].includes(raw.toLowerCase()) : raw;
      });

      let quantity = get('quantity');
      quantity = quantity === '' ? 1 : Number(quantity);
      if(!Number.isFinite(quantity) || quantity < 0) quantity = 1;

      const currentValue = Number(get('currentValue')) || 0;
      const now = Date.now();

      itemsToImport.push({
        id: uuid(), type, name, thumb: '',
        status: get('status') || 'owned',
        dateAcquired: get('dateAcquired') || '',
        quantity,
        purchasePrice: Number(get('purchasePrice')) || 0,
        source: get('source') || '',
        currentValue,
        valueHistory: currentValue ? [{date: new Date().toISOString().slice(0,10), value: currentValue}] : [],
        saleLog: [],
        dateListed:'', listingPlatform:'', listingStage:'', listingPrice:0, listingUrl:'',
        dateSold:'', salePrice:0, salePlatform:'', saleBuyer:'',
        dateTraded:'', tradePartner:'', tradedFor:'',
        tags: (get('tags')||'').split(',').map(t=>t.trim()).filter(Boolean),
        notes: get('notes') || '',
        fields,
        createdAt: now,
        updatedAt: now
      });
    });

    if(!itemsToImport.length){
      toast('No valid rows found — every row needs at least a "name" value.', 6000);
      e.target.value=''; return;
    }

    const skipNote = skipped ? ` (${skipped} row${skipped===1?'':'s'} skipped — missing a name)` : '';
    const ok = await openConfirmModal({
      title: 'Import from CSV?',
      message: `Add ${itemsToImport.length} item${itemsToImport.length===1?'':'s'} to ${TYPE_META[type].label}${skipNote}? Photos aren't included — add those per item afterward.`,
      confirmLabel: 'Import'
    });
    if(!ok){ e.target.value=''; return; }

    for(const item of itemsToImport){ await dbPut(item); }
    await refreshItems();
    render();
    toast(`Imported ${itemsToImport.length} item${itemsToImport.length===1?'':'s'}.${skipNote}`, 6000);
  }catch(err){
    console.error('CSV import failed', err);
    toast(`CSV import failed — ${err.message || 'an unexpected error occurred'}. Please check the file and try again.`, 7000);
  }
  e.target.value = '';
}

/* ========================= SHOW REPORTS ========================= */
// Whatnot's own Seller Analytics already covers viewers, buyer counts, streamed time,
// etc per show — no need to rebuild that here. What it CAN'T show you is profit margin
// (it doesn't know what you paid for anything) or history beyond its 30-day window.
// This groups sales by an optional "Show / Event" tag and computes revenue, cost basis,
// and net profit per show from data already in the app.

// Items sold through Quick Sell (quantity/saleLog) prorate purchasePrice per unit —
// purchasePrice is the TOTAL paid for the original quantity, and originalQuantity is
// reconstructed as (units remaining) + (units already sold via saleLog), since Quick
// Sell always sells exactly one unit per saleLog entry.
function computeShowReports(){
  const rows = [];
  ALL_ITEMS.forEach(item=>{
    if(item.saleLog && item.saleLog.length){
      const originalQty = (Number(item.quantity)||0) + item.saleLog.length;
      const perUnitCost = originalQty > 0 ? (Number(item.purchasePrice)||0) / originalQty : 0;
      item.saleLog.forEach(entry=>{
        rows.push({
          show: (entry.showEvent || '').trim() || '(Untagged)',
          date: entry.date || '',
          revenue: Number(entry.price) || 0,
          cost: perUnitCost
        });
      });
    } else if(item.status === 'sold'){
      rows.push({
        show: (item.showEvent || '').trim() || '(Untagged)',
        date: item.dateSold || '',
        revenue: Number(item.salePrice) || 0,
        cost: Number(item.purchasePrice) || 0
      });
    }
  });

  const byShow = new Map();
  rows.forEach(r=>{
    if(!byShow.has(r.show)) byShow.set(r.show, {show:r.show, count:0, revenue:0, cost:0, lastDate:''});
    const g = byShow.get(r.show);
    g.count++;
    g.revenue += r.revenue;
    g.cost += r.cost;
    if(r.date && r.date > g.lastDate) g.lastDate = r.date;
  });

  const groups = Array.from(byShow.values()).map(g=> Object.assign(g, {profit: g.revenue - g.cost}));
  groups.sort((a,b)=>{
    if(a.show === '(Untagged)') return 1;
    if(b.show === '(Untagged)') return -1;
    return (b.lastDate||'').localeCompare(a.lastDate||'');
  });
  return groups;
}

function openShowReportsModal(){
  const groups = computeShowReports();
  const modalRoot = document.getElementById('modalRoot');
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal" style="max-width:640px;">
        <button class="close-x" id="closeModal">✕</button>
        <h3>Show Reports</h3>
        <div class="modal-sub">Profit per show, using your tagged sales — includes your cost basis, which Whatnot's own analytics can't show you.</div>
        ${groups.length ? `
          <div class="value-history-list" style="max-height:420px;">
            ${groups.map(g=>`
              <div class="value-history-row" style="flex-direction:column;align-items:stretch;gap:4px;padding:12px 0;">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
                  <strong>${esc(g.show)}</strong>
                  <span class="${g.profit>=0?'green':'red'}" style="font-weight:800;white-space:nowrap;">${g.profit>=0?'+':''}${fmtCurrency(g.profit)}</span>
                </div>
                <div style="font-size:12px;color:var(--muted);">${g.count} sale${g.count===1?'':'s'}${g.lastDate?' · last '+fmtDate(g.lastDate):''} · Revenue ${fmtCurrency(g.revenue)} · Cost ${fmtCurrency(g.cost)}</div>
              </div>

// Best-guess mapping to Whatnot's own category taxonomy. Whatnot periodically changes
// its exact category/sub-category names, so these are a starting point — always check
// them against Whatnot's current bulk-upload template before importing.
const WHATNOT_CATEGORY_GUESS = {
  cards:       {category:'Trading Cards',      sub:'Sports Trading Cards'},
  funko:       {category:'Toys & Hobbies',      sub:'Funko'},
  coins:       {category:'Coins & Money',       sub:'Coins'},
  toys:        {category:'Toys & Hobbies',      sub:'Action Figures & Toys'},
  memorabilia: {category:'Sports Memorabilia',  sub:'Autographs'}
};

function csvField(v){
  if(v == null) v = '';
  v = String(v);
  if(/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}

// Folds this item's category-specific fields (grade, year, license, etc.) plus notes
// into one description string, since Whatnot's template has no per-field columns.
function buildWhatnotDescription(type, item){
  const f = item.fields || {};
  const parts = CATEGORY_CONFIG[type]
    .filter(cfg => f[cfg.key])
    .map(cfg => `${cfg.label}: ${f[cfg.key]}`);
  if(item.notes) parts.push(item.notes);
  return parts.join(' | ');
}

// Cards/coins carry grading info in the description instead of a blunt Condition value;
// funko/toys/memorabilia have a field that maps reasonably well to a condition string.
function whatnotCondition(type, item){
  const f = item.fields || {};
  if(type === 'funko') return f.boxCondition || '';
  if(type === 'toys') return f.condition || '';
  if(type === 'memorabilia') return f.condition || '';
  return '';
}

async function exportWhatnotCSV(type){
  const items = itemsForType(type).filter(i => i.status === 'owned' || i.status === 'listed');
  if(!items.length){ toast('No owned or listed items in this collection to export.'); return; }

  const guess = WHATNOT_CATEGORY_GUESS[type] || {category:'', sub:''};
  const headers = ['Category','Sub Category','Title','Description','Quantity','Type','Price','Shipping Profile','Condition',
    'Image URL 1','Image URL 2','Image URL 3','Image URL 4','Image URL 5','Image URL 6','Image URL 7','Image URL 8'];
  const rows = [headers.map(csvField).join(',')];

  items.forEach(item=>{
    const price = (item.status === 'listed' && item.listingPrice) ? item.listingPrice : (item.currentValue || 0);
    const row = [
      guess.category, guess.sub, item.name || '', buildWhatnotDescription(type, item),
      Number(item.quantity) || 1, '', Number(price).toFixed(2), '', whatnotCondition(type, item),
      '', '', '', '', '', '', '', ''
    ];
    rows.push(row.map(csvField).join(','));
  });

  const csv = rows.join('\r\n');
  const filename = `whatnot-export-${type}-${new Date().toISOString().slice(0,10)}.csv`;
  const blob = new Blob([csv], {type:'text/csv'});

  let sharedViaNative = false;
  if(navigator.canShare && navigator.share){
    try{
      const file = new File([blob], filename, {type:'text/csv'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Whatnot Export'});
        sharedViaNative = true;
      }
    }catch(shareErr){
      if(shareErr && shareErr.name === 'AbortError'){ return; }
      console.error('Native share failed, falling back to direct download', shareErr);
    }
  }
  if(!sharedViaNative){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  toast(`Exported ${items.length} items to CSV. Image URLs are left blank — add photos manually in Whatnot's draft editor after importing. Double-check Category/Sub Category/Condition against Whatnot's current upload template first.`, 8000);
}

async function exportBackup(){
  toast('Preparing backup…');
  const filename = `grailkeeper-backup-${new Date().toISOString().slice(0,10)}.json`;
  try{
    const images = await dbGetAllImages();
    const payload = { exportedAt: new Date().toISOString(), items: ALL_ITEMS, images, breaks: ALL_BREAKS };
    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});

    // On phones — especially iOS Safari — clicking an <a download> link often does NOT
    // save a real file. Instead it opens the raw JSON as a webpage, and whatever the
    // person does next (Share > Save to Files, copy/paste, etc.) can easily corrupt or
    // wrap the content, which is exactly what breaks a later import. Where the device
    // supports the native Share Sheet, use that instead — it hands over a real file
    // (AirDrop, Save to Files, email, etc. all work correctly from it).
    let sharedViaNative = false;
    if(navigator.canShare && navigator.share){
      try{
        const file = new File([blob], filename, {type:'application/json'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:'GrailKeeper Backup'});
          sharedViaNative = true;
          markBackupDone();
          toast('Backup shared.');
        }
      }catch(shareErr){
        if(shareErr && shareErr.name === 'AbortError'){ return; } // person cancelled the share sheet — not an error
        console.error('Native share failed, falling back to direct download', shareErr);
      }
    }

    if(!sharedViaNative){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      markBackupDone();
      toast('Backup downloaded. On a phone, check your Files/Downloads app for it.');
    }
  }catch(err){
    console.error('Export failed', err);
    toast('Export failed — try reloading the page and exporting again.');
  }
  if(currentPage === 'dashboard') render(); // refresh so the backup reminder banner clears immediately
}

/* ========================= BACKUP REMINDER ========================= */
// Nudges the person to export a backup periodically — their data lives only in this
// browser, so it's easy to forget until it's too late. Uses localStorage (not
// IndexedDB) since this is disposable UI state, not collection data.

function markBackupDone(){
  try{ localStorage.setItem('gk_lastBackupAt', String(Date.now())); }catch(e){ /* ignore — private browsing etc */ }
}
function daysSinceLastBackup(){
  try{
    const v = localStorage.getItem('gk_lastBackupAt');
    if(!v) return null;
    return Math.floor((Date.now() - Number(v)) / 86400000);
  }catch(e){ return null; }
}
function isBackupReminderSnoozed(){
  try{
    const v = localStorage.getItem('gk_backupSnoozeUntil');
    return !!v && Date.now() < Number(v);
  }catch(e){ return false; }
}
function snoozeBackupReminder(days){
  try{ localStorage.setItem('gk_backupSnoozeUntil', String(Date.now() + days*86400000)); }catch(e){}
}
function shouldShowBackupReminder(){
  if(isBackupReminderSnoozed()) return false;
  if(ALL_ITEMS.length < 5) return false; // don't nag a brand-new, mostly-empty collection
  const days = daysSinceLastBackup();
  return days === null || days >= 14;
}
function renderBackupBanner(){
  if(!shouldShowBackupReminder()) return '';
  const days = daysSinceLastBackup();
  const msg = days === null
    ? "You haven't exported a backup yet."
    : `It's been ${days} day${days===1?'':'s'} since your last backup.`;
  return `
    <div class="backup-banner" id="backupBanner">
      <span>${msg} Your collection only lives in this browser — export a backup to keep it safe.</span>
      <div class="backup-banner-actions">
        <button class="btn small" id="backupBannerExportBtn">Export Backup</button>
        <button class="btn secondary small" id="backupBannerDismissBtn">Remind me later</button>
      </div>
    </div>
  `;
}
function attachDashboardEvents(){
  const exportBtn = document.getElementById('backupBannerExportBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportBackup);
  const dismissBtn = document.getElementById('backupBannerDismissBtn');
  if(dismissBtn) dismissBtn.addEventListener('click', ()=>{ snoozeBackupReminder(7); render(); });
}

async function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    if(file.size === 0){
      toast('That file is empty (0 bytes) — the download may not have completed. Try exporting again.', 6000);
      e.target.value = ''; return;
    }
    let text;
    try{
      text = await file.text();
      text = text.replace(/^﻿/, '').trim(); // strip a UTF-8 BOM some phones/apps add when saving/sharing text
    }catch(readErr){
      toast('Could not read that file from disk. Try selecting it again.', 6000);
      e.target.value = ''; return;
    }
    let payload;
    try{
      payload = JSON.parse(text);
    }catch(parseErr){
      // Second chance: some phone share/save flows wrap the raw JSON in extra
      // characters or an HTML shell instead of saving it as a clean file. Try to
      // recover just the JSON object from inside whatever we were given.
      const start = text.indexOf('{');
      const end = text.lastIndexOf('}');
      if(start !== -1 && end > start){
        try{ payload = JSON.parse(text.slice(start, end+1)); }catch(err2){ /* give up below */ }
      }
      if(!payload){
        console.error('Backup file is not valid JSON', parseErr, 'first 200 chars:', text.slice(0,200));
        toast(`Import failed — "${file.name}" isn't valid JSON, so it doesn't look like a real backup file. If this came from a phone, try re-sending it via AirDrop/Save to Files rather than copy-paste, or use "Export Backup" again on this computer's own browser instead.`, 8000);
        e.target.value = ''; return;
      }
      console.warn('Recovered JSON from a wrapped/corrupted file — the backup may be from a phone share flow.');
    }
    const items = payload.items || payload; // support raw array too
    const imageEntries = payload.images || [];
    const breakEntries = Array.isArray(payload.breaks) ? payload.breaks : [];
    if(!Array.isArray(items)){
      toast('Import failed — that JSON file doesn\'t contain an item list this app recognizes.', 6000);
      e.target.value = ''; return;
    }
    const breakWord = breakEntries.length ? ` and ${breakEntries.length} break${breakEntries.length===1?'':'s'}` : '';
    const proceed = await openConfirmModal({
      title: 'Import backup?',
      message: `Import ${items.length} items${breakWord}? This will add to (not replace) your current collection.`,
      confirmLabel: 'Import'
    });
    if(!proceed) return;
    const imageMap = new Map(imageEntries.map(en=>[en.id, en.images]));
    for(const item of items){
      if(!item.id) item.id = uuid();
      // Backwards-compatible with older single-file backups that embedded full-size
      // photos directly on the item (pre-thumbnail-split format).
      if(item.images && item.images.length && !imageMap.has(item.id)){
        imageMap.set(item.id, item.images);
      }
      delete item.images;
      if(!item.thumb && imageMap.has(item.id) && imageMap.get(item.id).length){
        item.thumb = await makeThumb(imageMap.get(item.id)[0]);
      }
      await dbPut(item);
      if(imageMap.has(item.id)){
        await dbPutImages(item.id, imageMap.get(item.id));
      }
    }
    for(const b of breakEntries){
      if(!b.id) b.id = uuid();
      await dbPutBreak(b);
    }
    await refreshItems();
    await refreshBreaks();
    render();
    toast(`Imported ${items.length} items${breakWord}.`);
  }catch(err){
    console.error('Import failed partway through saving', err);
    toast(`Import failed while saving — ${err.message || 'an unexpected error occurred'}. Your existing items are untouched; please try again.`, 7000);
  }
  e.target.value = '';
}
