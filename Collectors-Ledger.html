          <p>If you have more than one of the exact same item (e.g. 5 copies of the same Funko Pop), enter that count in "Quantity In Stock" instead of creating 5 separate entries. Dashboard and collection totals automatically multiply "Current Estimated Value" by quantity. When editing an item with stock ≥ 1, a "Quick Sell 1 Unit" button appears — click it to log one sale (price + platform) without leaving the rest of your stock. Quantity ticks down automatically, and once it hits 0 the item's status switches to "Sold" on its own.</p>
          <h4>Selling pipeline (active listings)</h4>
          <p>If you list an item for sale before it actually sells — like an eBay auction — set its Status to "Listed For Sale." A "Listing Stage" field lets you track where it's at: Active (No Bids), Has Bids, Awaiting Payment, or Ready to Ship, plus the current bid/asking price and a link back to the listing. It still counts as owned (you still have it in hand) until you switch it to "Sold." The Dashboard shows an "Active Listings" count so you can see your whole selling queue at a glance — handy if you've got a lot of auctions running at once.</p>
          <h4>Selling &amp; trading</h4>
          <p>Change an item's Status to "Sold" or "Traded" and matching fields appear for sale price/platform or trade partner/details. Sold items count toward "Total Sale Proceeds" on the dashboard instead of your current value total. "Wishlist" items are excluded from your spend and value totals entirely — handy for tracking things you want.</p>
          <h4>Filtering &amp; search</h4>
          <p>Each collection page has a search box plus filters for status and sort order. Search checks the item name and all of its category-specific fields (team, brand, character, etc), so you can find items by genre, team, or brand without a dedicated filter for each.</p>
          <h4>Dashboard</h4>
          <p>Shows totals across every collection: items owned, amount spent, current estimated value, unrealized gain/loss, and sale proceeds, plus a breakdown chart by collection type.</p>
          <h4>Card Breaks (P&amp;L tracking)</h4>
          <p>The "Card Breaks" page is a back-office profit/loss log for breaks you run on Whatnot, eBay Live, TikTok, etc — it's break-level only (box cost, total spot revenue, fees, shipping, and the resulting Net Profit/Loss). It does not track individual spots, buyers, or fulfillment — that stays in whichever break platform you actually sold spots on. Click "+ Log Break" to add one; Net Profit/Loss updates live as you type. Like your collection pages, it has search, status filtering, and sorting (including by Net P/L) once you've logged a few. The Dashboard shows your all-time break P&amp;L alongside your collection totals.</p>
          <h4>Show Reports (per-show profit)</h4>
          <p>If you sell on Whatnot or similar live shows, add an optional "Show / Event" tag when marking an item Sold (or in the Quick Sell form) — e.g. "Tue 8/12 Funko Night." Click "Show Reports" in the sidebar to see revenue, cost basis, and net profit grouped by that tag. This is meant to complement Whatnot's own Seller Analytics (viewers, buyer counts, streamed time), not replace it — Whatnot can't show you profit margin since it doesn't know what you paid for items, and its per-show data only covers the last 30 days, while this stays here permanently.</p>
          <h4>Bulk importing items (CSV)</h4>
          <p>Already have a spreadsheet of items? Each collection page has "Download Template" (a CSV with the right column headers and an example row for that collection type) and "Import CSV" (loads a filled-in CSV and adds every row as a new item). Only "name" is required — leave other columns blank if you don't have that info. Dropdown-style fields (like Grading Company or Condition) need to match one of that field's exact option values, shown in the template's example row, or they'll show as blank when you next edit that item. Photos aren't included in CSV import — add those per item afterward.</p>
          <h4>Selling on Whatnot (CSV export)</h4>
          <p>Each collection page has a "Whatnot CSV" button that exports your Owned and Listed items into a CSV file shaped for Whatnot's bulk-upload template (Category, Sub Category, Title, Description, Quantity, Price, Condition, etc). Category/Sub Category are best guesses — Whatnot updates its category list periodically, so confirm them (and Condition) against Whatnot's current template before uploading. Image URLs are always left blank, since Whatnot requires public web addresses and your photos are stored privately in this browser — add photos manually in Whatnot's draft editor after importing the CSV.</p>
          <h4>Backups</h4>
          <p>All your data (including photos) lives only in this browser. Use "Export Backup" regularly to save a JSON file you can keep safe or move to another computer. "Import Backup" adds items from a backup file into your current collection. If it's been a while since your last export, a reminder banner appears on the Dashboard — click "Remind me later" to snooze it for a week.</p>
          <h4>Works offline</h4>
          <p>Once you've loaded the app while online, it keeps working with no connection — handy at a card show with bad signal. It always uses the newest version when you're online; the offline copy is only a fallback. (This only applies to the deployed web link — offline caching isn't available when opening the file directly from your computer.)</p>
          <h4>Large collections (thousands of items)</h4>
          <p>Each collection page loads 60 items at a time with a "Load More" button, and grid thumbnails are stored separately from full-size photos, so browsing stays fast even with a large collection. Full photos load only when you open an item. If a single collection grows very large, using search/status filters will keep things snappier than scrolling through everything.</p>
        </div>
      </div>
    </div>
  `;
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
  bindModalEscape();
}

/* ========================= INIT ========================= */

async function init(){
  try{
    await ensureDB();
    await refreshItems();
    await refreshBreaks();
  }catch(err){
    console.error('Failed to open database', err);
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>This browser does not support local storage (IndexedDB), so the app cannot save data. Try opening this file in an up-to-date Chrome, Edge, or Firefox.</p></div>';
    return;
  }
  render();
}

init();

// Offline support: registers sw.js so the app shell loads even with no connection.
// Service workers require http(s)/localhost — silently skipped when opened directly
// from disk (file://) or if the browser doesn't support them, so the app keeps
// working normally either way.
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('Service worker registration failed (app still works fine without it):', err);
    });
  });
}

})();
</script>
